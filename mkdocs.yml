site_name: smallestai Python SDK
site_description: Build, deploy, and operate Smallest AI voice agents from Python.
site_url: https://smallest-inc.github.io/smallest-python-sdk/
repo_url: https://github.com/smallest-inc/smallest-python-sdk
repo_name: smallest-inc/smallest-python-sdk
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - content.code.copy
    - content.code.annotate
    - toc.follow

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guides:
      - Agents: guides/agents.md
      - Agent crew (custom LLM): guides/crew.md
      - Transfer calls: guides/transfer-call.md
      - Call logs & recordings: guides/calls.md
      - Build with a coding agent: guides/coding-agents.md
  - Reference:
      - Method cheatsheet: reference/methods.md
      - Helpers API: reference/helpers.md

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          paths: [src]
          options:
            show_source: false
            docstring_style: numpy
            members_order: source
            show_root_heading: true
            heading_level: 3

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/smallest-inc/smallest-python-sdk
    - icon: material/book-open-variant
      link: https://docs.smallest.ai
