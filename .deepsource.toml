# DeepSource config. Takes effect once the DeepSource GitHub app is activated on the
# repo. The SDK is mostly Fern-generated, so the generated surfaces are excluded to keep
# analysis focused on hand-written code (crew, cli, helpers, tools, integrations,
# telemetry). Tune exclude_patterns if the generated layout changes.
version = 1

exclude_patterns = [
  "src/smallestai/**/raw_client.py",
  "src/smallestai/**/client.py",
  "src/smallestai/**/socket_client.py",
  "src/smallestai/**/types/**",
  "src/smallestai/**/errors/**",
  "src/smallestai/core/**",
  "src/smallestai/environment.py",
  "src/smallestai/**/__init__.py",
]

test_patterns = [
  "tests/**",
]

[[analyzers]]
name = "python"
enabled = true

[[analyzers]]
name = "secrets"
enabled = true
